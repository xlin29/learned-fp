# LearnedFP demo config — CPU smoke test on the bundled lab_data/.
# Goal: exercise the full 9-key train + ensemble vote code path on a laptop.
# Uses the fixed-config trainer (no Bayesian search) with all 9 keys × 2 epochs.
#
# Expected runtime: ~2-3 minutes on a modern laptop CPU (varies with core
# count). Used by pipeline/demo.sh. Not a paper-scale configuration —
# at this scale numbers stay near base rate; the demo verifies the code
# path runs end-to-end. Paper Top-k uplift requires 30 epochs and the
# full corpus (see fixed_3k.yaml / bayes_dp.yaml).

variant: fixed
seed: 42
gpu: false

# All 9 paper rendering keys (§4.1 / Figure 2). The full keyset is wired up
# so the demo exercises the per-key training loop and the cross-key vote
# fusion path; uplift over base rate is a paper-scale claim (§5.4,
# "Per-key contribution"), not something this 5-device smoke test
# demonstrates numerically.
keys: AUTO9

# Optimizer / schedule — minimal epochs for a fast smoke test.
epochs: 2
batch_size: 64
lr: 1.0e-3
wd: 1.0e-4
label_smoothing: 0.05
ema: 0.999
warmup_epochs: 1
dropout: 0.2

# Data split
test_frac: 0.20

# Vote
n_test_per_key: 5
per_key_trace_agg: logit_mean
fuse_mode: logit_sum
topk: "1,5,10,20"
